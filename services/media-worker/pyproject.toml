[project]
name = "radcliffe-media-worker"
version = "0.1.0"
description = "Radcliffe LiveKit media and speech worker"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx==0.28.1",
  "misaki[en]==0.9.4",
  "mlx-audio==0.4.6",
  "mlx-whisper==0.4.3",
  "numpy==2.4.2",
  "parakeet-mlx==0.5.1",
  "pipecat-ai[livekit]==1.5.0",
  "pydantic-settings==2.14.2",
  "radcliffe-domain",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radcliffe_media"]

[tool.uv.sources]
radcliffe-domain = { workspace = true }
