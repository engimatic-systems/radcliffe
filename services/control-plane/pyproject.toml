[project]
name = "radcliffe-control-plane"
version = "0.1.0"
description = "Radcliffe HTTP control plane and LiveKit token service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.139.0",
  "httpx==0.28.1",
  "livekit-api==1.2.0",
  "pydantic-settings==2.14.2",
  "radcliffe-domain",
  "uvicorn[standard]==0.51.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radcliffe_control"]

[tool.uv.sources]
radcliffe-domain = { workspace = true }
