services:
  livekit:
    image: livekit/livekit-server:v1.13.3
    command: ["--config", "/etc/livekit/livekit.yaml"]
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./livekit.yaml:/etc/livekit/livekit.yaml:ro
      - ./certs:/etc/livekit/certs:ro
    profiles: ["production"]

  livekit-local:
    image: livekit/livekit-server:v1.13.3
    command:
      - "--config-body"
      - |
        port: 7880
        log_level: debug
        rtc:
          tcp_port: ${RADCLIFFE_LIVEKIT_RTC_PORT:-7881}
        keys:
          devkey: secret
      - "--node-ip"
      - "${RADCLIFFE_LIVEKIT_NODE_IP:-127.0.0.1}"
      - "--udp-port"
      - "${RADCLIFFE_LIVEKIT_RTC_PORT:-7882}"
    ports:
      - "7880:7880"
      - "${RADCLIFFE_LIVEKIT_RTC_PORT:-7881}:${RADCLIFFE_LIVEKIT_RTC_PORT:-7881}/tcp"
      - "${RADCLIFFE_LIVEKIT_RTC_PORT:-7882}:${RADCLIFFE_LIVEKIT_RTC_PORT:-7882}/udp"
    profiles: ["local"]
