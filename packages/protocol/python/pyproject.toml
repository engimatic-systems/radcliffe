[project]
name = "radcliffe-protocol"
version = "0.1.0"
description = "Generated Radcliffe Protocol v2 Python bindings"
requires-python = ">=3.12,<3.13"
dependencies = ["protobuf==6.33.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radcliffe_protocol"]
