[project]
name = "radcliffe-domain"
version = "0.1.0"
description = "Radcliffe domain model, projections, and persistence"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiosqlite==0.22.1",
  "pydantic==2.13.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radcliffe_domain"]
